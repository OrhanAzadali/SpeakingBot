services:
  - type: web
    name: speakbot-lang-platform
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Вы укажете этот ключ вручную в панели управления Render
